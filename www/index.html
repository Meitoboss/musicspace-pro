<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>

  <script src="capacitor.js"></script>

  <!-- バックグラウンド再生の維持用偽装処理 -->
  <script>
    (function() {
      Object.defineProperty(document, 'visibilityState', { get: function() { return 'visible'; }, configurable: true });
      Object.defineProperty(document, 'hidden', { get: function() { return false; }, configurable: true });
      const block = function(e) { e.stopImmediatePropagation(); };
      window.addEventListener('visibilitychange', block, true);
      document.addEventListener('visibilitychange', block, true);
      window.addEventListener('pagehide', block, true);
    })();
  </script>

  <style>
    :root {
      --bg: #0d0d11;
      --card: #181820;
      --accent: #7c4dff;
      --text: #f1f2f6;
      --sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 180px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--card);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 10px;
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .thumb {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      margin-right: 12px;
      object-fit: cover;
    }

    .info {
      flex: 1;
      overflow: hidden;
    }

    .title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 12px;
      color: var(--sub);
      margin-top: 4px;
    }

    .player-dock {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(24, 24, 32, 0.98);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #playing-title {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 最小枠（144p低画質ストリーミング強制用） */
    .iframe-container {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #yt-player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="main">
    <form class="search-bar" onsubmit="event.preventDefault(); search();">
      <input type="text" id="q" placeholder="曲名やアーティスト名...">
      <button type="submit">検索</button>
    </form>
    <div id="list"></div>
  </div>

  <div class="player-dock">
    <div id="playing-title">曲を選択してください</div>
    <div class="iframe-container">
      <div id="yt-player"></div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const API_KEY = 'AIzaSyD0qeDWYwSK-S3g3-ESyGhi-UUziAjZo9g';
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'playsinline': 1,
          'autoplay': 1,
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,
          'vq': 'small' // 低画質指定
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 再生開始時に画質を最低（144p/small）に強制してギガ節約
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (player.setPlaybackQuality) {
          player.setPlaybackQuality('small');
        }
      }
    }

    async function search() {
      const query = document.getElementById('q').value;
      if (!query) return;

      const list = document.getElementById('list');
      list.innerHTML = '<p style="color:var(--sub)">検索中...</p>';

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
        const data = await res.json();
        list.innerHTML = '';

        (data.items || []).forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <img class="thumb" src="${item.snippet.thumbnails.default.url}">
            <div class="info">
              <div class="title">${item.snippet.title}</div>
              <div class="artist">${item.snippet.channelTitle}</div>
            </div>
          `;
          div.onclick = () => play(item.id.videoId, item.snippet.title);
          list.appendChild(div);
        });
      } catch (err) {
        list.innerHTML = `<p style="color:#ff5252">エラー: ${err.message}</p>`;
      }
    }

    function play(videoId, title) {
      document.getElementById('playing-title').textContent = title;
      if (player && player.loadVideoById) {
        player.loadVideoById({
          videoId: videoId,
          suggestedQuality: 'small'
        });
      }
    }
  </script>
</body>
</html>
