<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicSpace Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1db954;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .track-info {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>MusicSpace Pro</h2>
    <input type="text" id="youtubeUrl" placeholder="YouTube URLを貼り付け..." value="https://www.youtube.com/watch?v=UxxajLWwzqY">
    <button onclick="playMusic()">再生する</button>

    <div class="track-info" id="trackTitle">曲名がここに表示されます</div>
    <audio id="audioPlayer" controls playsinline></audio>
  </div>

  <script>
    const RENDER_SERVER_URL = 'https://musicspace-pro.onrender.com';

    async function playMusic() {
      const inputUrl = document.getElementById('youtubeUrl').value;
      const titleElement = document.getElementById('trackTitle');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!inputUrl) {
        alert('YouTubeのURLを入力してください');
        return;
      }

      titleElement.innerText = '音声を取得中...';

      try {
        // RenderサーバーのAPIを呼び出す
        const response = await fetch(`${RENDER_SERVER_URL}/api/audio?url=${encodeURIComponent(inputUrl)}`);
        const data = await response.json();

        if (data.status === 'success' && data.url) {
          titleElement.innerText = data.title;
          audioPlayer.src = data.url;
          await audioPlayer.play();
        } else {
          titleElement.innerText = '再生エラー';
          alert('音声URLの取得に失敗しました');
        }
      } catch (error) {
        console.error(error);
        titleElement.innerText = '通信エラー';
        alert('サーバーとの通信に失敗しました');
      }
    }
  </script>
</body>
</html>
