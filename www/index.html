<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      margin: 12px 16px;
      border-radius: 12px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 120px 16px;
      display: none;
    }

    .content-section.active {
      display: block;
    }

    /* 検索エリア */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* トラックリスト */
    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* プレイヤーバー（画面下部固定） */
    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .file-input-label {
      display: block;
      text-align: center;
      padding: 20px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--text-sub);
      cursor: pointer;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('youtube')">YouTube 検索</button>
    <button class="tab-btn" onclick="switchTab('local')">ローカルファイル</button>
  </div>

  <!-- YouTube 検索セクション -->
  <div id="youtube-section" class="content-section active">
    <form class="search-box" onsubmit="event.preventDefault(); searchYouTube();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <!-- ローカルファイルセクション -->
  <div id="local-section" class="content-section">
    <label class="file-input-label">
      📁 音楽ファイルを開く (MP3, AAC, WAV)
      <input type="file" id="local-file-input" accept="audio/*" multiple style="display: none;" onchange="loadLocalFiles(event)">
    </label>
    <div id="local-playlist"></div>
  </div>

  <!-- 固定プレイヤーバー -->
  <div class="player-bar">
    <div class="now-playing">
      <div id="player-title" class="track-title">再生中の曲はありません</div>
    </div>
    <div class="player-controls">
      <audio id="audio-player" controls style="width: 100%; border-radius: 8px;"></audio>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const playerTitle = document.getElementById('player-title');

    // 予備のInvidiousサーバーリスト（自動フォールバック対応）
    const INVIDIOUS_INSTANCES = [
      'https://inv.tux.pizza',
      'https://invidious.drgns.space',
      'https://invidious.privacydev.net',
      'https://vid.puffyan.us',
      'https://invidious.projectsegfau.lt'
    ];

    let currentInstance = INVIDIOUS_INSTANCES[0];

    // タブ切り替え
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

      if (tab === 'youtube') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('youtube-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('local-section').classList.add('active');
      }
    }

    // YouTube 検索（複数サーバー自動切り替え付き）
    async function searchYouTube() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';

      let success = false;

      for (const instance of INVIDIOUS_INSTANCES) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒タイムアウト

          const response = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) continue;
          
          const videos = await response.json();
          currentInstance = instance; // 成功したサーバーを保持

          resultsDiv.innerHTML = '';
          if (!videos || videos.length === 0) {
            resultsDiv.innerHTML = '<p style="color: var(--text-sub);">該当する曲が見つかりませんでした。</p>';
            return;
          }

          videos.forEach(video => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `
              <img class="track-thumb" src="${video.videoThumbnails?.[0]?.url || ''}" alt="">
              <div class="track-info">
                <div class="track-title">${video.title}</div>
                <div class="track-artist">${video.author}</div>
              </div>
            `;
            item.onclick = () => playYouTubeVideo(video.videoId, video.title, video.author);
            resultsDiv.appendChild(item);
          });

          success = true;
          break; // 成功したらループを抜ける
        } catch (err) {
          console.warn(`Instance failed: ${instance}`, err);
        }
      }

      if (!success) {
        resultsDiv.innerHTML = '<p style="color: #ff5252;">検索サーバーの接続に失敗しました。少し時間をおいて再試行してください。</p>';
      }
    }

    // YouTube音声再生
    function playYouTubeVideo(videoId, title, artist) {
      const audioUrl = `${currentInstance}/latest_version?id=${videoId}&italic=0`;
      audio.src = audioUrl;
      audio.play();

      playerTitle.textContent = title;

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: 'MusicSpace Pro'
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      }
    }

    // ローカルファイル読み込み
    function loadLocalFiles(event) {
      const files = event.target.files;
      const playlistDiv = document.getElementById('local-playlist');
      playlistDiv.innerHTML = '';

      Array.from(files).forEach(file => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
          <div class="track-info">
            <div class="track-title">${file.name}</div>
            <div class="track-artist">ローカルファイル</div>
          </div>
        `;
        item.onclick = () => {
          const url = URL.createObjectURL(file);
          audio.src = url;
          audio.play();
          playerTitle.textContent = file.name;

          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: file.name,
              artist: 'Local Track',
              album: 'MusicSpace Pro'
            });
          }
        };
        playlistDiv.appendChild(item);
      });
    }
  </script>
</body>
</html>
