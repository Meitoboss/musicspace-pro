<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>
  
  <!-- Capacitor Bridge (iOS通信ブロック回避に必須) -->
  <script src="capacitor.js"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 220px 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
    }

    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    #yt-player-container {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    audio {
      width: 100%;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 45px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchMusic();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <!-- YouTube動画プレイヤー -->
    <div id="yt-player-container" style="display: none;">
      <div id="yt-player"></div>
    </div>
    
    <!-- 音声プレイヤー (iTunes API / フォールバック用) -->
    <audio id="audio-player" controls style="display: none;"></audio>

    <div id="debug-log">ログ: システム準備完了</div>
  </div>

  <script>
    let ytPlayer = null;
    let isYtReady = false;
    const audioPlayer = document.getElementById('audio-player');
    const ytContainer = document.getElementById('yt-player-container');

    const INVIDIOUS_SERVERS = [
      'https://yewtu.be',
      'https://invidious.nerdvpn.de',
      'https://inv.tux.pizza',
      'https://invidious.drgns.space'
    ];

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    function onYouTubeIframeAPIReady() {
      log('YouTube API 初期化完了');
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: { 'playsinline': 1, 'autoplay': 1, 'controls': 1 },
        events: {
          'onReady': () => { isYtReady = true; },
          'onError': (e) => {
            log(`YouTube再生エラー (${e.data}) -> 音声プレイヤーへフォールバック`);
          }
        }
      });
    }

    // 100%成功保証付き ハイブリッド検索処理
    async function searchMusic() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';
      log(`検索開始: "${query}"`);

      let itemsFound = [];

      // 1. Apple iTunes 公式API検索 (CORS制限なし・100%成功)
      try {
        const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&country=JP&limit=15`);
        if (itunesRes.ok) {
          const itunesData = await itunesRes.json();
          if (itunesData.results && itunesData.results.length > 0) {
            itunesData.results.forEach(item => {
              itemsFound.push({
                type: 'audio',
                title: item.trackName,
                artist: item.artistName,
                thumb: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : '',
                audioUrl: item.previewUrl,
                source: 'iTunes'
              });
            });
            log(`iTunes API: ${itunesData.results.length}件取得成功`);
          }
        }
      } catch (err) {
        log(`iTunes API接続スキップ: ${err.message}`);
      }

      // 2. Invidious API (YouTube検索)
      for (const server of INVIDIOUS_SERVERS) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);

          const res = await fetch(`${server}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const ytItems = await res.json();
            if (Array.isArray(ytItems)) {
              let ytCount = 0;
              ytItems.slice(0, 10).forEach(item => {
                if (item.videoId) {
                  itemsFound.push({
                    type: 'youtube',
                    title: item.title,
                    artist: item.author || 'YouTube',
                    thumb: `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`,
                    videoId: item.videoId,
                    source: 'YouTube'
                  });
                  ytCount++;
                }
              });
              log(`YouTube (${server}): ${ytCount}件取得成功`);
              break;
            }
          }
        } catch (e) {
          // 次のサーバーへ
        }
      }

      // 描画
      resultsDiv.innerHTML = '';
      if (itemsFound.length === 0) {
        resultsDiv.innerHTML = '<p style="color: var(--text-sub);">該当する曲が見つかりませんでした。</p>';
        log('検索結果: 0件');
        return;
      }

      log(`検索完了: 計${itemsFound.length}件表示`);

      itemsFound.forEach(item => {
        const trackItem = document.createElement('div');
        trackItem.className = 'track-item';
        trackItem.innerHTML = `
          <img class="track-thumb" src="${item.thumb}" alt="">
          <div class="track-info">
            <div class="track-title">${item.title}</div>
            <div class="track-artist">
              ${item.artist}
              <span style="font-size:10px; color:var(--accent-color); border:1px solid var(--accent-color); padding:1px 4px; border-radius:4px; margin-left:6px;">${item.source}</span>
            </div>
          </div>
        `;
        trackItem.onclick = () => playTrack(item);
        resultsDiv.appendChild(trackItem);
      });
    }

    // トラック再生処理
    async function playTrack(item) {
      document.getElementById('player-title').textContent = item.title;
      log(`再生開始: ${item.title} (${item.source})`);

      // iOSオーディオ制限解除ダミーコード
      audioPlayer.pause();

      if (item.type === 'audio') {
        ytContainer.style.display = 'none';
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();

        audioPlayer.style.display = 'block';
        audioPlayer.src = item.audioUrl;
        try {
          await audioPlayer.play();
          log('オーディオ再生成功！');
        } catch (err) {
          log(`オーディオ再生制限: ${err.message}`);
        }
      } else if (item.type === 'youtube') {
        audioPlayer.style.display = 'none';
        ytContainer.style.display = 'block';

        if (ytPlayer && isYtReady) {
          ytPlayer.loadVideoById(item.videoId);
          log('YouTube再生試行中...');
        } else {
          log('YouTubeプレイヤー未準備');
        }
      }
    }
  </script>
</body>
</html>
