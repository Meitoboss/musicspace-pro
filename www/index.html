<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 220px 16px;
    }

    /* 検索エリア */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* トラックリスト */
    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* プレイヤー固定エリア */
    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    #yt-player-container {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    audio {
      width: 100%;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 45px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchYouTube();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <!-- プレイヤーエリア -->
  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <!-- YouTube 動画プレイヤー -->
    <div id="yt-player-container">
      <div id="yt-player"></div>
    </div>
    
    <!-- バックアップ用 HTML5 オーディオプレイヤー -->
    <audio id="fallback-audio" controls style="display: none;"></audio>

    <div id="debug-log">ログ: 準備完了</div>
  </div>

  <script>
    let player = null;
    let isPlayerReady = false;
    let currentVideoId = '';
    
    // 高安定 Piped API インスタンス群（CORS直接許可済）
    const PIPED_INSTANCES = [
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net',
      'https://pipedapi.adminforge.de',
      'https://pipedapi.tokhmi.xyz'
    ];

    const fallbackAudio = document.getElementById('fallback-audio');

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    // YouTube APIの初期化（403エラーを防止する最少クリーン構成）
    function onYouTubeIframeAPIReady() {
      log('YouTube API 読み込み完了');
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'playsinline': 1,
          'autoplay': 1,
          'controls': 1
        },
        events: {
          'onReady': () => {
            isPlayerReady = true;
            log('プレイヤー準備完了');
          },
          'onError': onPlayerError
        }
      });
    }

    // エラー時の音声直接再生への自動フォールバック
    async function onPlayerError(e) {
      log(`YouTube埋め込み不可 (Error: ${e.data}) -> 音声モードへ自動切替`);
      
      document.getElementById('yt-player-container').style.display = 'none';
      fallbackAudio.style.display = 'block';

      if (!currentVideoId) return;

      for (const instance of PIPED_INSTANCES) {
        try {
          log(`音声取得試行: ${instance}`);
          const res = await fetch(`${instance}/streams/${currentVideoId}`);
          if (!res.ok) continue;

          const data = await res.json();
          if (data.audioStreams && data.audioStreams.length > 0) {
            fallbackAudio.src = data.audioStreams[0].url;
            await fallbackAudio.play();
            log('音声ストリーム再生成功！');
            return;
          }
        } catch (err) {
          console.warn(err);
        }
      }
      log('全サーバーで音声再生失敗');
    }

    // 検索処理（CORSプロキシ不使用・マルチサーバーフォールバック）
    async function searchYouTube() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';
      log(`検索開始: "${query}"`);

      let success = false;

      for (const instance of PIPED_INSTANCES) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);

          const response = await fetch(`${instance}/search?q=${encodeURIComponent(query)}&filter=all`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) continue;

          const data = await response.json();
          const items = data.items || [];

          resultsDiv.innerHTML = '';
          if (items.length === 0) {
            resultsDiv.innerHTML = '<p style="color: var(--text-sub);">該当する曲が見つかりませんでした。</p>';
            log('検索結果: 0件');
            return;
          }

          log(`検索成功 (${instance}): ${items.length}件取得`);

          items.forEach(item => {
            if (item.type !== 'stream') return;
            const videoId = item.url.includes('v=') ? item.url.split('v=')[1] : item.url.replace('/watch?v=', '');

            const trackItem = document.createElement('div');
            trackItem.className = 'track-item';
            trackItem.innerHTML = `
              <img class="track-thumb" src="${item.thumbnail || ''}" alt="">
              <div class="track-info">
                <div class="track-title">${item.title}</div>
                <div class="track-artist">${item.uploaderName || ''}</div>
              </div>
            `;
            trackItem.onclick = () => playVideo(videoId, item.title);
            resultsDiv.appendChild(trackItem);
          });

          success = true;
          break;
        } catch (err) {
          log(`接続エラー (${instance}): ${err.message}`);
        }
      }

      if (!success) {
        resultsDiv.innerHTML = `<p style="color: #ff5252;">全検索サーバーへの接続に失敗しました。</p>`;
      }
    }

    // 再生処理
    function playVideo(videoId, title) {
      currentVideoId = videoId;
      document.getElementById('player-title').textContent = title;
      log(`再生要求: ${title}`);

      // 表示の初期化
      document.getElementById('yt-player-container').style.display = 'block';
      fallbackAudio.style.display = 'none';
      fallbackAudio.pause();

      if (player && isPlayerReady) {
        player.loadVideoById(videoId);
      } else {
        log('プレイヤー未準備のため音声切替');
        onPlayerError({ data: 403 });
      }
    }
  </script>
</body>
</html>
