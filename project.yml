name: MusicSpace
options:
  bundleIdPrefix: com.musicspace
  deploymentTarget:
    iOS: 15.0
targets:
  MusicSpace:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        PRODUCT_BUNDLE_IDENTIFIER: com.musicspace.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""