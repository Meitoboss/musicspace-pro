<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Space Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #1db954; color: #fff; font-weight: bold; cursor: pointer; }
        .song-card { display: flex; align-items: center; gap: 12px; background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .song-card img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 12px; color: #aaa; }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #282828; padding: 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <!-- 1. 検索バー -->
    <div class="search-box">
        <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
        <button onclick="searchSong()">検索</button>
    </div>

    <!-- 2. 検索結果リスト -->
    <div id="results-list"></div>

    <!-- 3. 再生プレイヤーバー -->
    <div class="player-bar">
        <div id="now-playing" style="font-size: 14px;">曲が選択されていません</div>
        <button id="play-btn" onclick="togglePlay()" disabled>再生</button>
    </div>

    <audio id="audio-player" style="display:none;"></audio>

<script>
    // ★ 本番のRenderサーバーURLを設定
    const BACKEND_URL = "https://<YOUR-RENDER-URL>.onrender.com";

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const nowPlayingText = document.getElementById('now-playing');

    // 楽曲検索
    async function searchSong() {
        const query = document.getElementById('search-input').value;
        if (!query) return;

        const resultsContainer = document.getElementById('results-list');
        resultsContainer.innerHTML = "<p>検索中...</p>";

        try {
            const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            
            resultsContainer.innerHTML = "";
            data.results.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-card';
                item.onclick = () => playSong(song.id, song.title, song.uploader, song.thumbnail);
                item.innerHTML = `
                    <img src="${song.thumbnail}" alt="art">
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.uploader}</div>
                    </div>
                `;
                resultsContainer.appendChild(item);
            });
        } catch (err) {
            resultsContainer.innerHTML = "<p>検索エラーが発生しました</p>";
        }
    }

    // 再生実行（プロキシ経由 ＆ バックグラウンド対応）
    async function playSong(videoId, title, artist, thumbnail) {
        nowPlayingText.textContent = `読み込み中: ${title}`;
        playBtn.disabled = true;

        // FastAPIプロキシエンドポイントを直接指定
        audio.src = `${BACKEND_URL}/api/proxy/${videoId}`;

        try {
            await audio.play();
            nowPlayingText.textContent = `再生中: ${title}`;
            playBtn.textContent = "停止";
            playBtn.disabled = false;

            // ロック画面・通知領域の操作情報をセット
            setupMediaSession(title, artist, thumbnail);
        } catch (err) {
            nowPlayingText.textContent = "再生エラー";
            playBtn.disabled = false;
        }
    }

    // 再生 / 停止 トグル
    function togglePlay() {
        if (audio.paused) {
            audio.play();
            playBtn.textContent = "停止";
        } else {
            audio.pause();
            playBtn.textContent = "再生";
        }
    }

    // ロック画面・バックグラウンド再生コントロール設定
    function setupMediaSession(title, artist, thumbnail) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: artist,
                artwork: [{ src: thumbnail, sizes: '512x512', type: 'image/jpeg' }]
            });

            navigator.mediaSession.setActionHandler('play', () => {
                audio.play();
                playBtn.textContent = "停止";
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                playBtn.textContent = "再生";
            });
        }
    }
</script>
</body>
</html>
