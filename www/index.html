<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>MusicSpace Pro</title>
  
  <script src="capacitor.js"></script>

  <!-- Brave方式: バックグラウンド移行時の自動一時停止を防止 -->
  <script>
    (function() {
      Object.defineProperty(document, 'visibilityState', { get: function() { return 'visible'; }, configurable: true });
      Object.defineProperty(document, 'hidden', { get: function() { return false; }, configurable: true });
      const block = function(e) { e.stopImmediatePropagation(); };
      window.addEventListener('visibilitychange', block, true);
      document.addEventListener('visibilitychange', block, true);
      window.addEventListener('pagehide', block, true);
    })();
  </script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 220px 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    #player-container {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 40px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchMusic();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <div id="player-container">
      <div style="color: #666; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 13px;">
        曲を選択するとプレイヤーが起動します
      </div>
    </div>

    <div id="debug-log">ログ: エラー153フィルター適用済み</div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyD0qeDWYwSK-S3g3-ESyGhi-UUziAjZo9g';

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    // 埋め込み再生許可（videoEmbeddable=true）の動画のみを厳選検索
    async function searchMusic() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">再生可能な動画を検索中...</p>';
      log(`API検索実行 (Embeddable限定): "${query}"`);

      try {
        // ★ videoEmbeddable=true でアプリ再生可能な動画のみに絞り込む
        const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;
        
        const res = await fetch(apiUrl);
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error ? errData.error.message : 'API通信エラー');
        }

        const data = await res.json();
        const items = data.items || [];

        resultsDiv.innerHTML = '';
        if (items.length === 0) {
          resultsDiv.innerHTML = '<p style="color: var(--text-sub);">再生可能な曲が見つかりませんでした。</p>';
          log('検索結果: 0件');
          return;
        }

        log(`検索成功: ${items.length}件の再生可能動画を取得`);

        items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channelTitle = item.snippet.channelTitle;
          const thumbUrl = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;

          const trackItem = document.createElement('div');
          trackItem.className = 'track-item';
          
          trackItem.innerHTML = `
            <img class="track-thumb" src="${thumbUrl}" alt="">
            <div class="track-info">
              <div class="track-title">${title}</div>
              <div class="track-artist">${channelTitle}</div>
            </div>
          `;

          trackItem.onclick = () => playVideoDirectIframe(videoId, title, channelTitle);
          resultsDiv.appendChild(trackItem);
        });

      } catch (err) {
        log(`API検索エラー: ${err.message}`);
        resultsDiv.innerHTML = `<p style="color: #ff5252;">検索エラー: ${err.message}</p>`;
      }
    }

    // 原点OriginをYouTube自身に見せかけてダイレクト埋め込み
    function playVideoDirectIframe(videoId, title, artist) {
      document.getElementById('player-title').textContent = `${title} (${artist})`;
      log(`再生準備: ${videoId}`);

      const container = document.getElementById('player-container');
      
      // origin=https://www.youtube.com を指定した直挿入URL
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&enablejsapi=1&origin=https://www.youtube.com`;

      container.innerHTML = `<iframe id="yt-iframe" src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen style="width:100%; height:100%; border:none;"></iframe>`;

      log('直挿入iframe再生スタート');
    }
  </script>
</body>
</html>
