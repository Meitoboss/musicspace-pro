<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>
  
  <script src="capacitor.js"></script>
  <!-- YouTube 公式 IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 240px 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    #yt-player-container {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 40px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchMusic();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <!-- YouTube 公式プレイヤー本体 -->
    <div id="yt-player-container">
      <div id="yt-player"></div>
    </div>

    <div id="debug-log">ログ: 公式プレイヤー初期化待ち</div>
  </div>

  <script>
    let ytPlayer = null;
    let isYtReady = false;

    // 軽量な検索専用サーバー群（ID特定のみに使用）
    const SEARCH_SERVERS = [
      'https://inv.tux.pizza',
      'https://invidious.nerdvpn.de',
      'https://yewtu.be'
    ];

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    // YouTube 公式 IFrame API 初期化処理
    function onYouTubeIframeAPIReady() {
      log('YouTube公式API準備完了');
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'playsinline': 1,
          'autoplay': 1,
          'controls': 1
        },
        events: {
          'onReady': () => {
            isYtReady = true;
            log('プレイヤー準備完了');
          },
          'onError': (e) => {
            log(`YouTubeプレイヤーエラー: Code ${e.data}`);
          }
        }
      });
    }

    // iTunes API による超高速楽曲検索
    async function searchMusic() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';
      log(`検索開始: "${query}"`);

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&country=JP&limit=20`);
        if (!res.ok) throw new Error('検索通信エラー');

        const data = await res.json();
        const items = data.results || [];

        resultsDiv.innerHTML = '';
        if (items.length === 0) {
          resultsDiv.innerHTML = '<p style="color: var(--text-sub);">該当する曲が見つかりませんでした。</p>';
          log('検索結果: 0件');
          return;
        }

        log(`検索成功: ${items.length}件取得`);

        items.forEach(item => {
          const trackItem = document.createElement('div');
          trackItem.className = 'track-item';
          const thumbUrl = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : '';
          
          trackItem.innerHTML = `
            <img class="track-thumb" src="${thumbUrl}" alt="">
            <div class="track-info">
              <div class="track-title">${item.trackName}</div>
              <div class="track-artist">${item.artistName}</div>
            </div>
          `;

          trackItem.onclick = () => playFullTrack(item.trackName, item.artistName);
          resultsDiv.appendChild(trackItem);
        });

      } catch (err) {
        log(`検索失敗: ${err.message}`);
        resultsDiv.innerHTML = `<p style="color: #ff5252;">検索エラーが発生しました。</p>`;
      }
    }

    // フル動画・音声の再生処理
    async function playFullTrack(title, artist) {
      document.getElementById('player-title').textContent = `${title} - ${artist}`;
      log(`VideoID特定中: "${title} ${artist}"`);

      let videoId = null;

      // YouTube VideoID の特定（動画検索のみ実施）
      for (const server of SEARCH_SERVERS) {
        try {
          const searchQuery = `${title} ${artist}`;
          const res = await fetch(`${server}/api/v1/search?q=${encodeURIComponent(searchQuery)}&type=video`);
          if (res.ok) {
            const videos = await res.json();
            if (Array.isArray(videos) && videos.length > 0 && videos[0].videoId) {
              videoId = videos[0].videoId;
              log(`VideoID特定成功: ${videoId}`);
              break;
            }
          }
        } catch (e) {
          // 次の検索サーバーへ
        }
      }

      if (!videoId) {
        log('YouTube IDの取得に失敗しました');
        return;
      }

      // 公式プレイヤーで読み込み＆再生
      if (ytPlayer && isYtReady) {
        log('YouTube公式プレイヤーでフル再生開始');
        ytPlayer.loadVideoById(videoId);
      } else {
        log('プレイヤーがまだ初期化されていません');
      }
    }
  </script>
</body>
</html>
