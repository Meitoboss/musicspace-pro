name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project MusicSpace.xcodeproj \
          -scheme MusicSpace \
          -archivePath build/MusicSpace.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p build/IPA
        cd build/MusicSpace.xcarchive/Products/Applications/
        zip -r ../../../IPA/MusicSpace.ipa *.app

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App-IPA
        path: build/IPA/MusicSpace.ipa