<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>

  <script src="capacitor.js"></script>

  <!-- バックグラウンド再生停止防止スクリプト -->
  <script>
    (function() {
      Object.defineProperty(document, 'visibilityState', { get: function() { return 'visible'; }, configurable: true });
      Object.defineProperty(document, 'hidden', { get: function() { return false; }, configurable: true });
      const block = function(e) { e.stopImmediatePropagation(); };
      window.addEventListener('visibilitychange', block, true);
      document.addEventListener('visibilitychange', block, true);
      window.addEventListener('pagehide', block, true);
    })();
  </script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 220px 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 50px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchMusic();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <!-- バックグラウンド再生に対応した標準 HTML5 Audio タグ -->
    <audio id="audio-player" controls playsinline></audio>

    <div id="debug-log">ログ: iOS端末ダイレクト解析モード</div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyD0qeDWYwSK-S3g3-ESyGhi-UUziAjZo9g';

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    // 1. YouTube Data API で曲を検索
    async function searchMusic() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';
      log(`検索実行: "${query}"`);

      try {
        const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('YouTube APIエラー');

        const data = await res.json();
        const items = data.items || [];

        resultsDiv.innerHTML = '';
        if (items.length === 0) {
          resultsDiv.innerHTML = '<p style="color: var(--text-sub);">曲が見つかりませんでした。</p>';
          return;
        }

        items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channelTitle = item.snippet.channelTitle;
          const thumbUrl = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;

          const trackItem = document.createElement('div');
          trackItem.className = 'track-item';
          
          trackItem.innerHTML = `
            <img class="track-thumb" src="${thumbUrl}" alt="">
            <div class="track-info">
              <div class="track-title">${title}</div>
              <div class="track-artist">${channelTitle}</div>
            </div>
          `;

          trackItem.onclick = () => loadAndPlayAudioDirect(videoId, title, channelTitle);
          resultsDiv.appendChild(trackItem);
        });

      } catch (err) {
        log(`検索エラー: ${err.message}`);
        resultsDiv.innerHTML = `<p style="color: #ff5252;">エラーが発生しました: ${err.message}</p>`;
      }
    }

    // 2. iPhone端末から直接 YouTube API (iOS公式クライアント) を叩いて音源URLを取得
    async function loadAndPlayAudioDirect(videoId, title, artist) {
      document.getElementById('player-title').textContent = `${title} (${artist})`;
      log(`iPhone端末から直接音源解析中: ${videoId}`);

      const audioPlayer = document.getElementById('audio-player');
      audioPlayer.pause();
      audioPlayer.src = '';

      try {
        const playerApiUrl = 'https://www.youtube.com/youtubei/v1/player';
        const payload = {
          videoId: videoId,
          context: {
            client: {
              clientName: 'IOS',
              clientVersion: '19.45.4',
              deviceModel: 'iPhone14,3',
              osName: 'iOS',
              osVersion: '17.5.1.21F90'
            }
          }
        };

        const res = await fetch(playerApiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'User-Agent': 'com.google.ios.youtube/19.45.4 (iPhone14,3; U; CPU iOS 17_5_1 like Mac OS X; ja_JP)'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`HTTPエラー: ${res.status}`);

        const data = await res.json();
        const formats = data?.streamingData?.adaptiveFormats || [];

        // 最高音質の audio/m4a フォーマットを抽出
        const audioFormat = formats
          .filter(f => f.mimeType && f.mimeType.includes('audio'))
          .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];

        if (audioFormat && audioFormat.url) {
          log('m4a音源の取得成功！');
          audioPlayer.src = audioFormat.url;
          await audioPlayer.play();
          log('バックグラウンド再生を開始しました');
        } else {
          throw new Error('音声URLが見つかりませんでした');
        }

      } catch (err) {
        log(`解析エラー: ${err.message}`);
        alert(`再生エラー: ${err.message}`);
      }
    }
  </script>
</body>
</html>
