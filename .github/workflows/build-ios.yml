name: Build iOS App (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: パッケージのインストール
        run: npm ci

      - name: Capacitor 同期 (iOS)
        run: npx cap sync ios

      - name: CocoaPods のチェックと実行
        run: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: XcodeによるiOSアプリビルド (無署名)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi
          
          xcodebuild $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPAパッケージの作成
        run: |
          mkdir -p Payload
          if [ -d "ios/App/build/Release-iphoneos/App.app" ]; then
            cp -R ios/App/build/Release-iphoneos/App.app Payload/
          else
            cp -R ~/Library/Developer/Xcode/DerivedData/App-*/Build/Products/Release-iphoneos/App.app Payload/
          fi
          zip -r MusicSpacePro-unsigned.ipa Payload

      - name: 成果物 (.ipa) のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: MusicSpacePro-iOS-IPA
          path: MusicSpacePro-unsigned.ipa