<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicSpace Pro</title>
  
  <script src="capacitor.js"></script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #7c4dff;
      --text-color: #f0f0f5;
      --text-sub: #8e8e99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15, 15, 18, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 220px 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      object-fit: cover;
      margin-right: 12px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      background: rgba(26, 26, 36, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    audio {
      width: 100%;
    }

    #debug-log {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      max-height: 45px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>MusicSpace Pro</header>

  <div class="content-section">
    <form class="search-box" onsubmit="event.preventDefault(); searchMusic();">
      <input type="text" id="search-input" placeholder="曲名やアーティスト名を入力...">
      <button type="submit" class="btn">検索</button>
    </form>
    <div id="search-results"></div>
  </div>

  <div class="player-bar">
    <div id="player-title" class="track-title">曲を選択してください</div>
    
    <!-- 音声プレイヤー（フル再生・バックグラウンド再生対応） -->
    <audio id="audio-player" controls style="width: 100%;"></audio>

    <div id="debug-log">ログ: システム準備完了</div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audio-player');

    // 安定稼働している YouTube 音声ストリームプロキシ群
    const YOUTUBE_SEARCH_SERVERS = [
      'https://inv.tux.pizza',
      'https://invidious.nerdvpn.de',
      'https://yewtu.be',
      'https://invidious.drgns.space'
    ];

    function log(msg) {
      const logDiv = document.getElementById('debug-log');
      logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logDiv.textContent;
      console.log(msg);
    }

    // 高速・高精度検索（iTunes APIを使用）
    async function searchMusic() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p style="color: var(--text-sub);">検索中...</p>';
      log(`検索開始: "${query}"`);

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&country=JP&limit=20`);
        if (!res.ok) throw new Error('検索通信エラー');

        const data = await res.json();
        const items = data.results || [];

        resultsDiv.innerHTML = '';
        if (items.length === 0) {
          resultsDiv.innerHTML = '<p style="color: var(--text-sub);">該当する曲が見つかりませんでした。</p>';
          log('検索結果: 0件');
          return;
        }

        log(`検索成功: ${items.length}件取得`);

        items.forEach(item => {
          const trackItem = document.createElement('div');
          trackItem.className = 'track-item';
          const thumbUrl = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : '';
          
          trackItem.innerHTML = `
            <img class="track-thumb" src="${thumbUrl}" alt="">
            <div class="track-info">
              <div class="track-title">${item.trackName}</div>
              <div class="track-artist">${item.artistName}</div>
            </div>
          `;

          // タップでフル音源取得へ
          trackItem.onclick = () => playFullTrack(item.trackName, item.artistName, item.previewUrl);
          resultsDiv.appendChild(trackItem);
        });

      } catch (err) {
        log(`検索失敗: ${err.message}`);
        resultsDiv.innerHTML = `<p style="color: #ff5252;">検索エラーが発生しました。</p>`;
      }
    }

    // フル音源の取得および再生
    async function playFullTrack(title, artist, fallbackPreviewUrl) {
      document.getElementById('player-title').textContent = `${title} - ${artist}`;
      log(`フル音源取得中: "${title} ${artist}"`);

      // iOSオーディオ制限の即時解除（ダミー再生）
      audioPlayer.pause();
      audioPlayer.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      audioPlayer.play().catch(() => {});

      let fullAudioFound = false;

      // YouTubeからフル音源（.m4a / .webm ストリーム）を検索・取得
      for (const server of YOUTUBE_SEARCH_SERVERS) {
        try {
          log(`ストリーム検索: ${server}`);
          const searchQuery = `${title} ${artist}`;
          const searchRes = await fetch(`${server}/api/v1/search?q=${encodeURIComponent(searchQuery)}&type=video`);
          if (!searchRes.ok) continue;

          const videos = await searchRes.json();
          if (!Array.isArray(videos) || videos.length === 0) continue;

          const videoId = videos[0].videoId;
          log(`動画ID特定: ${videoId} -> 音声リンク抽出中`);

          const videoInfoRes = await fetch(`${server}/api/v1/videos/${videoId}`);
          if (!videoInfoRes.ok) continue;

          const videoInfo = await videoInfoRes.json();
          const adaptiveFormats = videoInfo.adaptiveFormats || [];

          // 音声ストリーム（m4a / webm）の抽出
          const audioFormat = adaptiveFormats.find(f => f.type && f.type.includes('audio'));

          if (audioFormat && audioFormat.url) {
            log('フル音声ストリーム取得成功！再生を開始します');
            audioPlayer.src = audioFormat.url;
            await audioPlayer.play();
            fullAudioFound = true;
            break;
          }
        } catch (e) {
          log(`サーバーエラー (${server}): ${e.message}`);
        }
      }

      // 万が一フル音源が全サーバーで取得できなかった場合は30秒試聴用へ安全フォールバック
      if (!fullAudioFound) {
        log('フル音源の取得に失敗したため、バックアップ音源で再生します');
        audioPlayer.src = fallbackPreviewUrl;
        await audioPlayer.play();
      }
    }
  </script>
</body>
</html>
