name: MusicSpace
options:
  bundleIdPrefix: com.musicspace
  deploymentTarget:
    iOS: 15.0
targets:
  MusicSpace:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicspace.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""